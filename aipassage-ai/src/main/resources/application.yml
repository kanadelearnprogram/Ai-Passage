spring:
  application:
    name: aipassage-ai
  profiles:
    active: local
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/ap_agent
    username: root
    password: 114514
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
  cloud:
    sentinel:
      # dashboard 可后置（计划 §4.3 第 1 条）；未起 dashboard 时可注释此行
      transport:
        # dashboard: 127.0.0.1:8080
      datasource:
        degrade:
          nacos:
            server-addr: 127.0.0.1:8848
            dataId: sentinel-degrade-rules.json
            rule-type: degrade
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
mybatis-flex:
  configuration:
    map-underscore-to-camel-case: false

server:
  port: 8431
  servlet:
    context-path: /api

# Sa-Token 配置（各服务保持一致，共享同一个 Redis）
sa-token:
  token-name: satoken
  timeout: 2592000
  active-timeout: -1
  is-concurrent: true
  is-read-cookie: true
  is-read-header: true
  token-style: uuid

# Agent 配置
article:
  agent:
    max-iterations: 10

springdoc:
  api-docs:
    path: /v3/api-docs

rocketmq:
  name-server: 127.0.0.1:9876