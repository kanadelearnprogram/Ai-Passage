spring:
  application:
    name: aipassage-article
  profiles:
    active: local
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/ap_article
    username: root
    password: 114514
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848

mybatis-flex:
  configuration:
    map-underscore-to-camel-case: false

server:
  port: 8421
  servlet:
    context-path: /api

# Sa-Token 配置（各服务保持一致，共享同一个 Redis）
sa-token:
  token-name: satoken
  timeout: 2592000
  active-timeout: -1
  is-concurrent: true
  is-read-cookie: true
  is-read-header: true
  token-style: uuid

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: com.kanade.aipassage.controller
rocketmq:
  name-server: 127.0.0.1:9876
  producer:
    group: aipassage-article-producer